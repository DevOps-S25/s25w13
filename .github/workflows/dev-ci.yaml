name: wf-ci-dev
on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
jobs:
  dev-pr-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Lint HTML
        run: npx htmlhint "**/*.html"
      - name: Lint CSS
        run: npx stylelint "**/*.css"
  dev-test-build:
    needs: "dev-pr-job"
    runs-on: ubuntu-latest
    steps:
      - name: Build With Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./dist"
      - name: Wf Summery
        run: echo "Workflow run was successfull"

