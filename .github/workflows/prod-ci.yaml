name: wf-prod-ci
on:
  pull_request:
    branches:
      - production
    types:
      - opened
      - synchronize
jobs:
  prod-pr-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: Lint HTML Files
        run: npx htmlhint "**/*.html"
      - name: Lint CSS Files
        run: npx stylelint "**/*.css"
      - name: Test Build
        run: npx parcel build "./src/index.html" --dist-dir "./dist"
      